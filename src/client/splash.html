<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0, viewport-fit=cover"
    />
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <title>Ghost Rally</title>
  </head>
  <body>
    <div class="scene">
      <span class="star s1"></span>
      <span class="star s2"></span>
      <span class="star s3"></span>
      <span class="star s4"></span>
      <span class="star s5"></span>
      <span class="star s6"></span>
      <div class="sun"></div>
      <div class="hill hill-back"></div>
      <div class="hill hill-front"></div>

      <div class="card">
        <div class="kicker" id="kicker">GHOST RALLY</div>
        <h1 class="headline" id="headline">Can you catch the ghost?</h1>
        <div class="countdown" id="countdown">
          <div class="countdown-label">NEW TRACK IN</div>
          <div class="countdown-time" id="countdown-time">--:--:--</div>
        </div>
        <div class="track-preview" id="track-preview"></div>
        <button class="cta" id="play-button">
          <span id="cta-label">🏁 &nbsp;RACE THE GHOST</span>
        </button>
        <div class="sub" id="sub"></div>
      </div>

      <div class="ground">
        <div class="grass"></div>
        <div class="dirt"></div>
      </div>

      <div class="convoy">
        <!-- record ghost, fleeing -->
        <div class="car ghost">
          <svg viewBox="0 0 120 70" width="104" height="61">
            <rect class="c-cage" x="4" y="6" width="18" height="5" rx="2" />
            <rect class="c-cage" x="8" y="10" width="5" height="12" rx="2" />
            <path class="c-cage" d="M40 30 A 22 22 0 0 1 80 26" fill="none" stroke-width="6" />
            <circle class="c-helmet" cx="58" cy="16" r="11" />
            <rect class="c-visor" x="60" y="11" width="10" height="8" rx="2" />
            <path class="c-body" d="M4 22 L42 26 L86 24 L116 36 L114 48 L8 48 Z" />
            <rect class="c-skirt" x="8" y="42" width="106" height="7" rx="3" />
            <g class="wheel">
              <circle class="w-tire" cx="30" cy="54" r="15" />
              <circle class="w-rim" cx="30" cy="54" r="8.5" />
              <line class="w-spoke" x1="30" y1="41.5" x2="30" y2="66.5" />
              <line class="w-spoke" x1="17.5" y1="54" x2="42.5" y2="54" />
            </g>
            <g class="wheel">
              <circle class="w-tire" cx="96" cy="54" r="15" />
              <circle class="w-rim" cx="96" cy="54" r="8.5" />
              <line class="w-spoke" x1="96" y1="41.5" x2="96" y2="66.5" />
              <line class="w-spoke" x1="83.5" y1="54" x2="108.5" y2="54" />
            </g>
          </svg>
          <div class="crown">👑</div>
        </div>

        <!-- the player's buggy, chasing -->
        <div class="car buggy">
          <span class="dust d1"></span>
          <span class="dust d2"></span>
          <span class="dust d3"></span>
          <svg viewBox="0 0 120 70" width="104" height="61">
            <rect class="c-cage" x="4" y="6" width="18" height="5" rx="2" />
            <rect class="c-cage" x="8" y="10" width="5" height="12" rx="2" />
            <path class="c-cage" d="M40 30 A 22 22 0 0 1 80 26" fill="none" stroke-width="6" />
            <circle class="c-helmet" cx="58" cy="16" r="11" />
            <rect class="c-visor" x="60" y="11" width="10" height="8" rx="2" />
            <path class="c-body" d="M4 22 L42 26 L86 24 L116 36 L114 48 L8 48 Z" />
            <rect class="c-skirt" x="8" y="42" width="106" height="7" rx="3" />
            <rect class="c-stripe" x="24" y="28" width="30" height="6" rx="3" />
            <circle class="c-light" cx="112" cy="34" r="4" />
            <g class="wheel">
              <circle class="w-tire" cx="30" cy="54" r="15" />
              <circle class="w-rim" cx="30" cy="54" r="8.5" />
              <line class="w-spoke" x1="30" y1="41.5" x2="30" y2="66.5" />
              <line class="w-spoke" x1="17.5" y1="54" x2="42.5" y2="54" />
            </g>
            <g class="wheel">
              <circle class="w-tire" cx="96" cy="54" r="15" />
              <circle class="w-rim" cx="96" cy="54" r="8.5" />
              <line class="w-spoke" x1="96" y1="41.5" x2="96" y2="66.5" />
              <line class="w-spoke" x1="83.5" y1="54" x2="108.5" y2="54" />
            </g>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
